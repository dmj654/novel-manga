name: NovelManga
options:
  bundleIdPrefix: com.novelmanga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.0.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0

targets:
  NovelManga:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Core
    dependencies:
      - package: GRDB
        product: GRDB
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novelmanga.app
        PRODUCT_NAME: NovelManga
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"

  NovelMangaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovelMangaTests
    dependencies:
      - target: NovelManga
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novelmanga.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NovelManga.app/NovelManga"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NovelManga:
    build:
      targets:
        NovelManga: all
        NovelMangaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NovelMangaTests
